<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>¿Salimos? 🐱</title>
<style>
:root{--bg1:#ffd1e8;--bg2:#c9b6ff;--card:#fffafc;--ink:#4a2a55;--pink:#ff5fa2;--pink2:#ff8cc0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#3a1a4d;--bg2:#1f1747;--card:#2d1f3f;--ink:#ffe3f1}}
:root[data-theme="dark"]{--bg1:#3a1a4d;--bg2:#1f1747;--card:#2d1f3f;--ink:#ffe3f1}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font-family:"Comic Sans MS","Chalkboard SE","Trebuchet MS",sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--bg1),var(--bg2));background-size:200% 200%;animation:bg 12s ease infinite;display:flex;align-items:center;justify-content:center;padding:20px;overflow-x:hidden}
@keyframes bg{50%{background-position:100% 100%}}
.card{position:relative;z-index:2;width:100%;max-width:420px;background:var(--card);border-radius:32px;padding:26px 22px 28px;text-align:center;box-shadow:0 20px 50px rgba(120,40,120,.3);border:4px dashed var(--pink2)}
h1{font-size:1.7rem;margin:6px 0 4px;line-height:1.2}
p{margin:4px 0 14px}
.cat{width:170px;height:150px;margin:0 auto;display:block;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-2deg)}}
.eye{transform-origin:center;transform-box:fill-box;animation:blink 4s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.tail{transform-origin:20px 120px;animation:wag 1s ease-in-out infinite alternate}
@keyframes wag{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
.paw{transform-origin:80px 110px;animation:wave 1.2s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-8deg)}to{transform:rotate(14deg)}}
label{display:block;text-align:left;font-weight:bold;margin:12px 4px 4px}
input{width:100%;font:inherit;font-size:1.05rem;padding:12px 14px;border-radius:16px;border:3px solid var(--pink2);background:#fff;color:#4a2a55;outline:none}
input:focus{border-color:var(--pink);box-shadow:0 0 0 4px rgba(255,95,162,.25)}
.row{display:flex;gap:10px}.row>div{flex:1}
button{font:inherit;font-weight:bold;font-size:1.15rem;border:none;border-radius:999px;padding:14px 26px;margin-top:20px;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--pink),#ff8a5f);box-shadow:0 8px 0 #c93d7c;transition:transform .1s,box-shadow .1s;animation:pulse 1.6s infinite}
button:active{transform:translateY(6px);box-shadow:0 2px 0 #c93d7c}
button.ghost{background:transparent;color:var(--ink);box-shadow:none;border:2px solid var(--pink2);font-size:.95rem;padding:10px 18px;animation:none;margin-top:12px}
@keyframes pulse{50%{transform:scale(1.05)}}
.hearts{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.h{position:absolute;bottom:-40px;animation:up linear infinite;opacity:.8}
@keyframes up{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
.hidden{display:none}
.err{color:#d12a6b;font-size:.9rem;min-height:1.2em;margin-top:8px}
.big{font-size:3rem;animation:bob 1.4s infinite}
</style>
</head>
<body>
<div class="hearts" id="hearts"></div>
<main class="card">
  <section id="form">
    <svg class="cat" viewBox="0 0 160 140" aria-hidden="true">
      <g class="tail"><path d="M30 120 Q-5 110 8 70 Q14 55 24 66" fill="none" stroke="#ffb066" stroke-width="12" stroke-linecap="round"/></g>
      <ellipse cx="82" cy="112" rx="40" ry="24" fill="#ffb066"/>
      <polygon points="42,48 46,12 72,34" fill="#ffb066"/><polygon points="118,48 114,12 88,34" fill="#ffb066"/>
      <polygon points="48,40 50,22 64,34" fill="#ff9ec4"/><polygon points="112,40 110,22 96,34" fill="#ff9ec4"/>
      <ellipse cx="80" cy="64" rx="42" ry="36" fill="#ffb066"/>
      <path d="M62 40 v10 M80 36 v12 M98 40 v10" stroke="#e8893a" stroke-width="4" stroke-linecap="round"/>
      <ellipse class="eye" cx="64" cy="66" rx="6" ry="8" fill="#3b2250"/><ellipse class="eye" cx="96" cy="66" rx="6" ry="8" fill="#3b2250"/>
      <circle cx="66" cy="63" r="2" fill="#fff"/><circle cx="98" cy="63" r="2" fill="#fff"/>
      <ellipse cx="80" cy="78" rx="5" ry="3.5" fill="#ff6fa5"/>
      <path d="M80 82 q-6 8 -12 3 M80 82 q6 8 12 3" fill="none" stroke="#3b2250" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="50" cy="80" r="7" fill="#ff9ec4" opacity=".6"/><circle cx="110" cy="80" r="7" fill="#ff9ec4" opacity=".6"/>
      <path d="M30 74 h-18 M30 80 l-16 6 M130 74 h18 M130 80 l16 6" stroke="#3b2250" stroke-width="2" stroke-linecap="round"/>
      <g class="paw"><ellipse cx="124" cy="104" rx="10" ry="14" fill="#ffb066"/><circle cx="124" cy="96" r="3" fill="#ff9ec4"/></g>
    </svg>
    <h1>¿Ir a ver Your Name? 🐾</h1>
    <p>Elige el día y la hora y confirma</p>
    <div class="row">
      <div><label for="dia">📅 Día</label><input type="date" id="dia"></div>
      <div><label for="hora">⏰ Hora</label><input type="time" id="hora"></div>
    </div>
    <label for="nombre">😺 Tu nombre</label>
    <input type="text" id="nombre" placeholder="¿Cómo te llamas?" maxlength="40">
    <div class="err" id="err"></div>
    <button id="enviar" type="button">Enviar </button>
    <br><button id="no" class="ghost" type="button">Mejor no 😿</button>
  </section>

  <section id="ok" class="hidden">
    <div class="big"></div>
    <h1>¡confirmado!</h1>
    <p id="resumen"></p>
    <p id="nota" style="font-size:.9rem;opacity:.85"></p>
  </section>
</main>

<script>
// Corazones y gatitos flotando
(function(){
  var box=document.getElementById('hearts'),em=['','🐱','','🐾','😸','','🐈'];
  for(var i=0;i<18;i++){
    var s=document.createElement('span');s.className='h';s.textContent=em[i%em.length];
    s.style.left=Math.random()*100+'%';s.style.fontSize=(18+Math.random()*26)+'px';
    s.style.animationDuration=(7+Math.random()*8)+'s';s.style.animationDelay=(-Math.random()*12)+'s';
    box.appendChild(s);
  }
})();

var $=function(id){return document.getElementById(id)};
var today=new Date().toISOString().slice(0,10);$('dia').min=today;

// El botón "No" se escapa
var no=$('no');
function huir(e){
  e.preventDefault();
  no.style.position='fixed';
  no.style.left=Math.max(8,Math.random()*(window.innerWidth-130))+'px';
  no.style.top=Math.max(8,Math.random()*(window.innerHeight-60))+'px';
  no.style.zIndex=5;
}
no.addEventListener('mouseenter',huir);no.addEventListener('touchstart',huir);no.addEventListener('click',huir);

var texto='';
function mostrar(guardado){
  $('form').classList.add('hidden');$('ok').classList.remove('hidden');
  $('resumen').textContent=texto;
  $('nota').textContent='Respuesta enviada 🐾';
}

$('enviar').addEventListener('click',async function(){
  var dia=$('dia').value,hora=$('hora').value,nombre=$('nombre').value.trim();
  if(!dia||!hora){$('err').textContent='Falta elegir el día y la hora 🙀';return}
  $('err').textContent='';
  var f=new Date(dia+'T12:00:00').toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'});
  texto=(nombre?nombre+', ':'')+'¡nos vemos el '+f+' a las '+hora+'! 🐱';
  var guardado=false;
  try{
    // Pega aquí la URL de tu Apps Script (ver instrucciones)
    var URL_SCRIPT='https://script.google.com/macros/s/AKfycbwPbMJ78iEYuC0uiXaE7ABU1Sa4u0wE2meBbPEYi2b4MLb9yv7YcCIFlzFIMDKhhg/exec';
    if(URL_SCRIPT.indexOf('http')===0){
      await fetch(URL_SCRIPT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},
        body:JSON.stringify({nombre:nombre,dia:dia,hora:hora})});
      guardado=true;
    }
  }catch(e){console.error(e)}
  mostrar(guardado);
});

</script>
</body>
</html>
